services:
  postgres:
    image: postgres:16-alpine
    container_name: evenkeel-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evenkeel
    volumes:
      - evenkeel_data:/var/lib/postgresql/data

volumes:
  evenkeel_data:
